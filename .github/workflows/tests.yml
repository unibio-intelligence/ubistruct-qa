name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: ruff check src scripts tests examples

      - name: Build source and wheel
        run: python -m build --no-isolation
      - name: Install built wheel
        run: |
          python -m pip uninstall -y ubistruct-qa
          python -m pip install --no-deps dist/*.whl
      - name: Run offline example against wheel
        run: python examples/offline_demo.py --output-dir demo-output
