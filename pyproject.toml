[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubistruct-qa"
version = "0.1.0"
description = "Target-adaptive model quality assessment for heterogeneous macromolecular assemblies"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "UniBio Intelligence, Inc.", email = "contact@unibiointelligence.com"},
]
keywords = [
  "CASP17",
  "model quality assessment",
  "protein complexes",
  "amyloid",
  "protein cage",
  "structural bioinformatics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
]

[project.urls]
Repository = "https://github.com/unibio-intelligence/ubistruct-qa"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "setuptools>=77,<85",
  "wheel>=0.45,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
ubistruct-immune = "casp17_qa:main"
ubistruct-fibril = "casp17_fibril_qa:main"
ubistruct-cage = "casp17_cage_qa:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "antibody_template_pairs",
  "casp17_cage_qa",
  "casp17_fibril_qa",
  "casp17_qa",
  "template_pairs",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
